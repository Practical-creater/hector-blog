# NexT theme override config
# Docs: https://theme-next.js.org/docs/getting-started/configuration
# Only values that differ from the theme's own defaults live here
# (node_modules/hexo-theme-next/_config.yml). Hexo deep-merges this file over
# the defaults, so upgrading the theme never touches these settings.

# Single-column layout with a slide-in sidebar (toggle at the bottom-left).
# Same family as the reference site — its footer says "NexT.Mist".
scheme: Mist

# Sidebar: collapsed on the index page, opens automatically on posts.
# Use `always` to keep it open on every page.
sidebar:
  display: post
  width_expanded: 300

# Site logo / favicon (source/images/logo.svg is the master; PNGs are
# rendered from it with rsvg-convert at 16, 32, 180 and 512 px).
favicon:
  small: /images/favicon-16x16.png
  medium: /images/favicon-32x32.png
  apple_touch_icon: /images/apple-touch-icon.png
  safari_pinned_tab: /images/logo-mask.svg

# Sidebar avatar — the logo for now; swap in a photo by dropping it at
# source/images/avatar.png and pointing `url` at it.
avatar:
  url: /images/logo-512.png
  rounded: true

# Creative Commons badge under the avatar (license itself defaults to by-nc-sa).
creative_commons:
  sidebar: true

# Top navigation: icon + label. Search is added automatically by local_search.
menu:
  home: / || fa fa-home
  about: /about/ || fa fa-user
  categories: /categories/ || fa fa-th
  archives: /archives/ || fa fa-archive
  talks: /talks/ || fa fa-comments

# Social links under the avatar — fill in your own, e.g.
#   GitHub: https://github.com/yourname || fab fa-github
#   E-Mail: mailto:you@example.com || fa fa-envelope
social:

# Typography: IBM Plex Sans for reading, IBM Plex Mono for the site title,
# headings and code — keeps the "terminal" flavour of the reference site
# without copying its all-monospace look. Fonts come from a Google Fonts
# mirror reachable from mainland China; set `enable: false` to fall back
# to system fonts if it is ever slow.
font:
  enable: true
  host: https://fonts.loli.net
  global:
    external: true
    family: IBM Plex Sans
  title:
    external: true
    family: IBM Plex Mono
  headings:
    external: true
    family: IBM Plex Mono
  codes:
    external: true
    family: IBM Plex Mono

# Custom palette (teal accent instead of NexT's default blue/black).
custom_file_path:
  variable: source/_data/variables.styl

# Browser chrome colour on mobile.
theme_color:
  light: "#1f6f78"
  dark: "#1f6f78"

footer:
  since: 2026
  icon:
    name: fa fa-terminal
    color: "#1f6f78"

# Visitor / page-view counters in the footer (third-party busuanzi service;
# harmless to disable if it ever goes offline).
busuanzi_count:
  enable: true

# Footer language dropdown is OFF on purpose: it links to /en/... URLs that
# only exist when the site is generated as one full tree per language. This
# site doesn't do that — each post simply declares its own `lang:` and NexT
# renders that post's UI strings in that language. (Off also re-enables the
# theme's build cache.)
language_switcher: false

# Local full-text search (adds the Search icon to the menu).
local_search:
  enable: true

# Math: scripts load only on posts that set `mathjax: true` in front-matter.
math:
  mathjax:
    enable: true

# Copy button on code blocks.
codeblock:
  copy_button:
    enable: true
    style: mac
